<!DOCTYPE html>
<html>
<head>
  <title>Uusi kirja</title>
</head>

<body>
<h1>Uusi kirja</h1>

<form action="/create_items" method="post">

  <p>
    Kirjan nimi: <br>
    <input type="text" name="title" maxlength="50" required>
  </p>

  <p>
    Kirjailijan nimi: <br>
    <input type="text" name="author" maxlength="50" required>
  </p>

  {% for class in classes %}
    <p>
      {{ class }}: <br>
      <select name="classes">
        <option value="">(valitse)</option>
      {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
      {% endfor %}
      </select>
    </p>
  {% endfor %}

  <p>
    Kuvaus: <br>
    <textarea name="description" rows="8" cols="40" maxlength="500"></textarea>
  </p>

  <p>
    Arvio (1–5): <br>
    <input type="number" name="rate" min="1" max="5" required>
  </p>

  <p>
    <input type="submit" value="Luo arvostelu">
  </p>

  <p>
  <a href="/">Takaisin etusivulle</a>
  </p>

</form>
</body>
</html>
