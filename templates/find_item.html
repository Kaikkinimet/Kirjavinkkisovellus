<!DOCTYPE html>
<html>

<head>
  <title>Etsi kirja</title>
</head>

<body>
    <h1>Etsi kirja</h1>

    <form action="/find_item" method="get">
      <p>
        hakusana: <input type="text" name="query" value="{{ query or ''}}">
        
      </p>
      <input type="submit" value="Lähetä">

    </form>

<p>
  <a href="/">Takaisin</a>
  
</p>

    {% if query %}
    <h2>Haun tulokset</h2>
    <ul>
      {% for item in results %}
      <li><a href="/item/{{ item.id }}">{{ item.title}}</a></li>
      {% endfor %}
    </ul>


    {% endif %}


  </body>

</html>
