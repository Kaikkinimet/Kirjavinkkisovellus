{% extends "layout.html" %}

{% block title %}Etsi kirja{% endblock %}

{% block content %}

<h2>Etsi kirja</h2>
<form action="/find_item" method="get">
  <p>
    hakusana: <input type="text" name="query" value="{{ query or ''}}">
  </p>
  <input type="submit" value="Lähetä">
</form>

<p>
  <a href="/">Takaisin etusivulle</a>
</p>

{% if query %}
<h2>Haun tulokset</h2>

<ul>
  {% for item in results %}
  <li><a href="/item/{{ item.id }}">{{ item.title}}</a></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
